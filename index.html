<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новая вкладка</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="new-tab">
    <section class="center">
      <div class="logo-slot">
        <img class="brand-logo" src="assets/logo.png" alt="Walderhu">
      </div>

      <form class="smartbox" action="https://yandex.ru/search/" method="get">
        <input type="search" name="text" autocomplete="off" placeholder="Введите запрос или адрес">
        <button class="microphone" type="button" aria-label="Голосовой поиск">
          <img src="assets/microphone.png" alt="">
        </button>
        <button class="scan" type="button" aria-label="Поиск по картинке">
          <img src="assets/camera.png" alt="">
        </button>
      </form>

      <section class="tiles" aria-label="Быстрые ссылки">
      </section>
    </section>
    <button class="controls" type="button" aria-label="Настроить страницу">
      <img src="assets/settings.png" alt="">
    </button>

    <div class="tile-menu" hidden>
      <button type="button" data-action="edit">Изменить</button>
      <button type="button" data-action="delete">Удалить</button>
    </div>

    <dialog class="group-dialog" aria-labelledby="group-dialog-title">
      <header class="group-header">
        <button class="group-back" type="button" aria-label="Назад" hidden>&larr;</button>
        <input class="group-dialog-title" id="group-dialog-title" type="text" aria-label="Название группы">
        <button class="group-close" type="button" aria-label="Закрыть">X</button>
      </header>
      <section class="group-tiles" aria-label="Ссылки в группе"></section>
      <div class="group-tile-menu" popover="manual">
        <button type="button" data-action="edit">Изменить</button>
        <button type="button" data-action="delete">Удалить</button>
      </div>
    </dialog>

    <dialog class="tile-dialog" aria-labelledby="tile-dialog-title">
      <form class="tile-form" method="dialog">
        <h2 id="tile-dialog-title">Добавить плитку</h2>
        <div class="tile-form-main">
          <div class="tile-image-preview" aria-label="Предпросмотр фото">
            <img class="tile-preview-img" src="" alt="">
            <div class="tile-image-tools">
              <button class="tile-paste-toggle" type="button">Из буфера</button>
              <button class="tile-file-button" type="button">С компьютера</button>
            </div>
          </div>
          <div class="tile-fields">
            <label>
              Название
              <input class="tile-title-input" type="text" autocomplete="off" required>
              <span class="tile-title-status" aria-live="polite"></span>
            </label>
            <label>
              Ссылка
              <input class="tile-url-input" type="text" autocomplete="off" placeholder="https://example.com" required>
            </label>
            <input class="tile-image-input" type="file" accept="image/*" hidden>
          </div>
        </div>
        <div class="tile-form-actions">
          <button class="tile-cancel" type="button">Отмена</button>
          <button class="tile-save" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="auto-link-title.js"></script>
  <script src="script.js"></script>
</body>

</html>
